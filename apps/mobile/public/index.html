<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: draw under the notch / home indicator; safe areas come from env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installable from Safari: Share → Add to Home Screen opens it full screen, like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blednify" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0a0a0c;
      }
      html {
        /* Avoid double-tap zoom without disabling pinch zoom. */
        touch-action: manipulation;
      }
      /* The viewport takes overscroll-behavior from the root element only; body's value doesn't carry over.
         Without this, a swipe between tabs on a page too short to scroll (Search) reaches the viewport: iOS
         rubber-bands the whole app and Chromium can turn it into a history back/forward navigation.
         Touch screens only, so desktop trackpads keep their swipe back/forward. */
      @media (pointer: coarse) {
        html {
          overscroll-behavior: none;
        }
      }
      body {
        overflow: hidden;
        /* App feel: no rubber-band page bounce, tap flashes, text selection or link previews on long-press. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        /* Keep offscreen pager scenes from widening the mobile viewport after a resize. */
        overflow: hidden;
      }
      /* WebKit 301994: a normal-flow, full-height document lets iPhone home-screen apps paint below
         the shortened viewport. Safari tabs keep percentage heights so controls clear the toolbar. */
      @media (display-mode: standalone) {
        html,
        body {
          height: 100lvh;
        }
        body {
          position: static;
          overflow: visible;
        }
        #root {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 100lvh;
          overflow: hidden;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Blednify.</noscript>
    <div id="root"></div>
  </body>
</html>
